services:
  # --- NODO PRIMARIO (MASTER) ---
  postgres-primario:
    image: postgis/postgis:16-3.4
    container_name: postgres_primario
    environment:
      POSTGRES_USER: alan
      POSTGRES_PASSWORD: password
      POSTGRES_DB: comida_db
    ports:
      - "5432:5432"
    volumes:
      - primario_data:/var/lib/postgresql/data
    # Usamos este truco nativo de Docker para meter la línea en pg_hba.conf de forma segura
    entrypoint: |
      bash -c "
      echo 'echo \"host replication alan all trust\" >> /var/lib/postgresql/data/pg_hba.conf' > /docker-entrypoint-initdb.d/setup-replication.sh
      exec docker-entrypoint.sh postgres -c wal_level=replica -c max_wal_senders=5 -c max_replication_slots=5
      "

  # --- NODO SECUNDARIO (REPLICA / STANDBY) ---
  postgres-replica:
    image: postgis/postgis:16-3.4
    container_name: postgres_replica
    environment:
      POSTGRES_USER: alan
      POSTGRES_PASSWORD: password
      POSTGRES_DB: comida_db
    ports:
      - "5433:5432"
    depends_on:
      - postgres-primario
    volumes:
      - replica_data:/var/lib/postgresql/data
    entrypoint: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Clonando base de datos principal...'
        until pg_basebackup -h postgres-primario -D /var/lib/postgresql/data -U alan -v -P -R -X stream; do
          echo 'Esperando al nodo primario...'
          sleep 1
        done
      fi
      exec docker-entrypoint.sh postgres
      "

# --- INSTANCIAS DE LA APLICACIÓN EN RUST ---

  app-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust_app_node_1
    ports:
      - "3001:3000"
      - "50052:50051" # Puerto para comunicación entre nodos
    environment:
      - PEER_ID=1
      - DATABASE_LEADER_URL=postgres://alan:password@postgres-primario:5432/comida_db
      - DATABASE_FOLLOWER_URL=postgres://alan:password@postgres-replica:5432/comida_db
      - CLUSTER_NODES=1=http://app-node-1:50051,2=http://app-node-2:50051,3=http://app-node-3:50051
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      - postgres-primario
      - postgres-replica

  app-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust_app_node_2
    ports:
      - "3002:3000"
      - "50053:50051" # Puerto para comunicación entre nodos
    environment:
      - PEER_ID=2
      - DATABASE_LEADER_URL=postgres://alan:password@postgres-primario:5432/comida_db
      - DATABASE_FOLLOWER_URL=postgres://alan:password@postgres-replica:5432/comida_db
      - CLUSTER_NODES=1=http://app-node-1:50051,2=http://app-node-2:50051,3=http://app-node-3:50051
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      - postgres-primario
      - postgres-replica

  app-node-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust_app_node_3
    ports:
      - "3003:3000"
      - "50054:50051" # Puerto para comunicación entre nodos
    environment:
      - PEER_ID=3
      - DATABASE_LEADER_URL=postgres://alan:password@postgres-primario:5432/comida_db
      - DATABASE_FOLLOWER_URL=postgres://alan:password@postgres-replica:5432/comida_db
      - CLUSTER_NODES=1=http://app-node-1:50051,2=http://app-node-2:50051,3=http://app-node-3:50051
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      - postgres-primario
      - postgres-replica

volumes:
  primario_data:
  replica_data: